name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # gltf-validator from node_modules runs inside the Python GLB checks.
      - run: npm ci --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check services tests scripts
      - run: ruff format --check services tests scripts
      - run: python -m pytest -q

  web:
    name: Frontend build, checks and browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run build
      - run: npm run test:js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: npx playwright install --with-deps chromium
      - name: Start workbench
        run: |
          IMG3D_DATA_DIR="$RUNNER_TEMP/data" python -m uvicorn services.api.app:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/api/health && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/server.log"; exit 1
      - run: npm run test:e2e
      - if: failure()
        run: cat "$RUNNER_TEMP/server.log" || true
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: .data/checks/smoke
          if-no-files-found: ignore
